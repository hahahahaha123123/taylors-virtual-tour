
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taylor's University Virtual Tour</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171717;
      color: white;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #222;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #ccc; }
    .tour {
      position: relative;
      width: min(100%, 1200px);
      margin: 24px auto;
      padding: 0 16px;
    }
    .scene {
      position: relative;
      height: min(65vh, 650px);
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #333;
      border-radius: 12px;
      overflow: hidden;
    }
    .scene img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      color: white;
    }
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      width: 54px;
      height: 54px;
      font-size: 30px;
      cursor: pointer;
      background: rgba(255,255,255,.9);
      color: #222;
    }
    .prev { left: 16px; }
    .next { right: 16px; }
    .caption {
      text-align: center;
      padding: 16px;
      color: #ddd;
    }
  </style>
</head>
<body>
  <header>
    <h1>Taylor's University Virtual Tour</h1>
    <p>Explore the campus one location at a time</p>
  </header>

  <main class="tour">
    <div class="scene">
      <img id="tourImage"
        src="https://placehold.co/1200x700/333333/ffffff?text=Add+Your+Campus+Photo"
        alt="Taylor's University campus">
      <button class="nav prev" onclick="move(-1)" aria-label="Previous location">‹</button>
      <button class="nav next" onclick="move(1)" aria-label="Next location">›</button>
    </div>
    <div class="caption" id="caption">Welcome — add your first campus photo</div>
  </main>

  <script>
    const locations = [
      {
        name: "Campus Entrance",
        image: "https://placehold.co/1200x700/333333/ffffff?text=Campus+Entrance"
      },
      {
        name: "Campus Building",
        image: "https://placehold.co/1200x700/444444/ffffff?text=Campus+Building"
      },
      {
        name: "Campus Interior",
        image: "https://placehold.co/1200x700/555555/ffffff?text=Campus+Interior"
      }
    ];

    let current = 0;

    function showLocation() {
      document.getElementById("tourImage").src = locations[current].image;
      document.getElementById("tourImage").alt = locations[current].name;
      document.getElementById("caption").textContent =
        locations[current].name + " (" + (current + 1) + " of " + locations.length + ")";
    }

    function move(direction) {
      current = (current + direction + locations.length) % locations.length;
      showLocation();
    }

    showLocation();
  </script>
</body>
</html>
